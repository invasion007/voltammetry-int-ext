<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伏安法测电阻 · 内接与外接 · 可交互课件</title>
<style>
  :root{
    /* A · Manim 基调：纯黑底 + 白线为主 + Manim 官方色常量
       红 = 电流表 / 偏大      蓝 = 电压表 / 偏小      黄 = 结论量 */
    --bg:#000000; --bg2:#0a0a0a; --panel:#0e0e0e; --line:#242424; --line2:#383838;
    --ink:#FFFFFF; --ink2:#B0B0B0; --muted:#888888;
    --red:#FC6255; --blue:#58C4DD; --yellow:#FFFF00; --gold:#F0AC5F; --green:#83C167;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; overflow:hidden;}
  .app{display:grid; grid-template-rows:auto auto 1fr auto auto; height:100vh;}

  header{position:relative; padding:7px 18px 6px; background:var(--bg2);
    border-bottom:1px solid var(--line); height:64px; overflow:hidden;}
  header .row1{display:flex; align-items:center; gap:10px; height:22px;}
  header .row2{display:flex; align-items:center; height:22px; margin-top:2px; padding-right:76px;}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap; line-height:22px;}
  .act{font-size:12.5px; color:var(--yellow); border:1px solid var(--line2); border-radius:10px;
    padding:0 9px; height:20px; line-height:18px; white-space:nowrap;}
  .tag{font-size:12px; border:1px solid var(--line2); border-radius:10px; padding:0 9px;
    height:20px; line-height:18px; white-space:nowrap; color:var(--ink2);}
  .steptitle{font-size:15px; color:var(--ink); font-weight:600; line-height:22px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stepsn{position:absolute; right:18px; top:10px; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums;}

  .topnav{display:flex; align-items:center; gap:5px; padding:5px 14px 6px;
    background:var(--bg2); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;}
  .topnav .grouplab{flex:0 0 auto; font-size:11px; letter-spacing:.6px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .topnav .sep{flex:0 0 auto; width:1px; height:15px; background:var(--line2); margin:0 5px;}
  .topnav a{flex:0 0 auto; min-width:27px; height:22px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; cursor:pointer;}
  .topnav a:hover{background:#1e1e1e; color:var(--ink);}
  .topnav a.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}

  .stage{display:grid; grid-template-columns:1fr 316px; min-height:0;}
  .canvaswrap{position:relative; min-width:0; min-height:0; padding:6px 8px 0 8px;}
  canvas{display:block; width:100%; height:100%; cursor:default; touch-action:none;}
  .hint{padding:6px 20px 0 20px; font-size:12.5px; color:var(--muted); height:42px; overflow:hidden;}
  .hint b{color:var(--yellow); font-weight:600;}

  aside{background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 14px; overflow-y:auto; min-height:0;}
  aside h3{font-size:12px; color:var(--muted); margin:13px 0 6px; font-weight:600; letter-spacing:.5px;}
  aside h3:first-child{margin-top:2px;}
  .rd{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:3px 0;
    font-size:12.5px; color:var(--ink2); border-bottom:1px dashed #242424;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:14px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rd b.red{color:var(--red);} .rd b.blue{color:var(--blue);} .rd b.yellow{color:var(--yellow);}
  .rd b.gold{color:var(--gold);} .rd b.grey{color:var(--muted);} .rd b.ok{color:var(--green);} .rd b.bad{color:var(--red);}
  .total{margin-top:8px; padding:8px 10px; border:1px solid var(--line2); border-radius:8px; background:#141414;}
  .total .lab{font-size:12px; color:var(--muted); display:block; margin-bottom:2px;}
  .total b{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.3px;}
  .total b.ok{color:var(--green);} .total b.warn{color:var(--gold);} .total b.bad{color:var(--red);}
  .formula{font-size:13.5px; color:var(--ink); background:#141414; border:1px solid var(--line2);
    border-radius:8px; padding:8px 10px; line-height:1.6; word-break:break-word;}
  .note{font-size:12.5px; color:var(--ink2); line-height:1.66;}
  .note b{color:var(--yellow); font-weight:600;}
  .grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .grp .lab{font-size:12.5px; color:var(--muted);}
  button{font-family:inherit; font-size:12.5px; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap;}
  button:hover{background:#1e1e1e; color:var(--ink);}
  button.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}
  button.main{background:#1a1a1a; color:var(--ink);}
  .hidden{display:none !important;}

  footer{display:flex; align-items:center; align-content:flex-start; gap:8px; flex-wrap:wrap; row-gap:6px;
    padding:8px 14px 9px; background:var(--bg2); border-top:1px solid var(--line);
    height:96px; overflow-y:auto;}
  .bar{position:relative; flex:1 1 90px; min-width:70px; height:6px; background:#141414; border-radius:3px;}
  .bar i{display:block; height:100%; width:0; background:var(--yellow); border-radius:3px;}
  .slider{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
  .slider input[type=range]{width:118px; accent-color:#4a4a4a;}
  .slider b{color:var(--ink); font-variant-numeric:tabular-nums; min-width:76px; text-align:right;}

  @media (max-width: 1080px){
    .stage{grid-template-columns:1fr 272px;}
    .slider input[type=range]{width:92px;}
  }
  @media (max-width: 760px){
    .stage{grid-template-columns:1fr; grid-template-rows:1fr auto;}
    aside{border-left:none; border-top:1px solid var(--line); max-height:26vh;}
    .canvaswrap{padding:3px 4px 0 4px;}
    .hint{padding:3px 10px 0 10px; height:52px; font-size:11.5px; line-height:1.36;}
    header{padding:5px 10px 4px; height:56px;}
    header .row1{height:20px; gap:7px;} header .row2{height:20px;}
    header h1{font-size:14px; line-height:20px;} .steptitle{font-size:12.5px; line-height:20px;}
    .stepsn{right:10px; top:7px; font-size:12px;}
    .topnav{padding:4px 8px 5px;}
    footer{padding:6px 10px 7px; gap:6px; height:118px;}
    .slider input[type=range]{width:76px;}
    .slider b{min-width:62px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="row1">
      <h1>伏安法测电阻 · 内接与外接</h1>
      <span class="act" id="actTag">第一幕</span>
      <span class="tag" id="modeTag">内接法</span>
    </div>
    <div class="row2"><span class="steptitle" id="stepTitle">—</span></div>
    <span class="stepsn" id="stepSn">1 / 17</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3>① 这一刻的读数</h3>
      <div id="rdGroup1"></div>

      <h3>② 这只表的内阻</h3>
      <div id="rdGroup2"></div>

      <div class="total"><span class="lab">关键一句</span><b id="rdVerdict" class="ok">—</b></div>

      <h3>③ 白话一句</h3>
      <div id="rdGroup3"></div>

      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>提示</h3>
      <div class="note" id="rdNote"></div>
      <div class="note" style="margin-top:6px;color:#888888">键盘 ← → 翻步，Home / End 到头；<b style="color:#F0AC5F">数字键 1~3</b> 换表头。画布上 <b style="color:#F0AC5F">Rₓ 的滑轨</b>可以直接拖。</div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev">◀ 上一步</button>
    <button id="btnNext" class="main">下一步 ▶</button>
    <button id="btnReset">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>

    <div class="slider" id="wrap_rx"><span>Rₓ</span>
      <input type="range" id="rgRx" min="0" max="1" step="0.002" value="0.4">
      <b id="lbRx">22 Ω</b></div>

    <div class="slider" id="wrap_rs"><span>串联 R_s</span>
      <input type="range" id="rgRs" min="0" max="100" step="1" value="20">
      <b id="lbRs">20 Ω</b></div>

    <div class="grp" id="wrap_head"><span class="lab">换表头</span>
      <span id="headBtns"></span></div>

    <div class="grp" id="wrap_ideal"><span class="lab">表</span>
      <span id="idealBtns"></span></div>
  </footer>
</div>

<script>


(function () {
'use strict';

var EMF = 3.0;
var A_RANGE = 0.6;
var V_RANGE = 3.0;
var RX_MIN = 1, RX_MAX = 5000;
var RS_MIN = 0, RS_MAX = 100, RS_DEF = 20;

var HEADS = [
{ key: 'h1', lab: '10 mA / 10 Ω',  Rg: 10,  Ig: 0.010,   title: '老式表头' },
{ key: 'h2', lab: '1 mA / 30 Ω',   Rg: 30,  Ig: 0.001,   title: '学生表头' },
{ key: 'h3', lab: '50 μA / 200 Ω', Rg: 200, Ig: 0.00005, title: '灵敏表头' }
];

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function clamp01(v) { return clamp(v, 0, 1); }

function head(key) {
for (var i = 0; i < HEADS.length; i++) { if (HEADS[i].key === key) { return HEADS[i]; } }
return HEADS[1];
}
function meters(key) {
var h = head(key);
return { Rg: h.Rg, Ig: h.Ig, Ug: h.Rg * h.Ig, RA: h.Rg * h.Ig / A_RANGE, RV: V_RANGE / h.Ig, lab: h.lab };
}
var IDEAL = { Rg: 0, Ig: 1, Ug: 0, RA: 0, RV: Infinity, lab: '理想表' };

function asM(m) {
if (!m) { return meters('h2'); }
return (typeof m === 'string') ? meters(m) : m;
}
function metersOf(st) { return st && st.ideal ? IDEAL : meters(st && st.hk); }
function rp(rx, m) { return isFinite(m.RV) ? rx * m.RV / (rx + m.RV) : rx; }

function rxOf(t) { return RX_MIN * Math.pow(RX_MAX / RX_MIN, clamp01(t)); }
function tOfRx(rx) { return Math.log(clamp(rx, RX_MIN, RX_MAX) / RX_MIN) / Math.log(RX_MAX / RX_MIN); }

function intRead(rx, rs, mm) {
var m = asM(mm);
var I = EMF / (rs + rx + m.RA);
var U = I * (rx + m.RA);
return { I: I, U: U, Ux: I * rx, Ua: I * m.RA, R: U / I, RA: m.RA, RV: m.RV };
}

function extRead(rx, rs, mm) {
var m = asM(mm);
var Rp = rp(rx, m);
var I = EMF / (rs + Rp);
var U = I * Rp;
return { I: I, U: U, Irx: U / rx, Iv: U / m.RV, R: U / I, RA: m.RA, RV: m.RV };
}

function deltaInt(rx, mm) { return asM(mm).RA / rx; }
function deltaExt(rx, mm) { var m = asM(mm); return -rx / (rx + m.RV); }
function deltaExtAbs(rx, mm) { var m = asM(mm); return rx / (rx + m.RV); }

function rCrit(mm) {
var m = asM(mm);
if (m.RA <= 0) { return 0; }
return (m.RA + Math.sqrt(m.RA * m.RA + 4 * m.RA * m.RV)) / 2;
}
function rCritApprox(mm) { var m = asM(mm); return Math.sqrt(m.RA * m.RV); }

function pickByError(rx, mm) { return Math.abs(deltaInt(rx, mm)) <= Math.abs(deltaExt(rx, mm)) ? 'int' : 'ext'; }

function touchTest(rx, rs, mm) {
var a = intRead(rx, rs, mm), b = extRead(rx, rs, mm);
var dU = Math.abs(a.U - b.U) / b.U;
var dI = Math.abs(a.I - b.I) / b.I;
return {
dU: dU, dI: dI, pick: dU > dI ? 'ext' : 'int',
Uint: a.U, Uext: b.U, Iint: a.I, Iext: b.I,
ratio: (dI > 0) ? dU / dI : Infinity
};
}

function voltMeasure(rx, rs, mm) {
var m = asM(mm);
var trueU = EMF * rx / (rs + rx);
var Rp = rp(rx, m);
var U = EMF * Rp / (rs + Rp);
return { trueU: trueU, U: U, err: (U - trueU) / trueU, RV: m.RV, Iv: U / m.RV };
}

function ampMeasure(rx, rs, mm) {
var m = asM(mm);
var trueI = EMF / (rs + rx);
var I = EMF / (rs + rx + m.RA);
return { trueI: trueI, I: I, err: (I - trueI) / trueI, RA: m.RA, Ua: I * m.RA };
}

function fmtR(v) {
if (!isFinite(v)) { return '—'; }
if (v >= 1000) { return (v / 1000).toFixed(2) + ' kΩ'; }
if (v >= 100) { return v.toFixed(0) + ' Ω'; }
if (v >= 10) { return v.toFixed(1) + ' Ω'; }
return v.toFixed(2) + ' Ω';
}
function fmtU(v) {
if (Math.abs(v) < 1e-12) { return '0 V'; }
if (Math.abs(v) < 1) { return (v * 1000).toFixed(1) + ' mV'; }
return v.toFixed(2) + ' V';
}
function fmtI(v) {
if (Math.abs(v) < 1e-12) { return '0 A'; }
if (Math.abs(v) < 1e-3) { return (v * 1e6).toFixed(1) + ' μA'; }
if (Math.abs(v) < 1) { return (v * 1000).toFixed(2) + ' mA'; }
return v.toFixed(3) + ' A';
}
function fmtP(v, d) { return (v * 100).toFixed(d === undefined ? 2 : d) + '%'; }
function fmtS(v) { return (v >= 0 ? '+' : '−') + fmtP(Math.abs(v), 2); }
function fmtX(v) { return v.toFixed(2) + ' 倍'; }

var D_MIN = 1e-4, D_MAX = 1;
function dPos(d) {
var a = Math.abs(d);
if (a < D_MIN) { a = D_MIN; }
if (a > D_MAX) { a = D_MAX; }
return (Math.log(a / D_MIN) / Math.log(D_MAX / D_MIN));
}

function explain(key) {
var T = {
ask: '伏安法就是量出它两端的电压 U、流过它的电流 I，用 R = U / I 反推。麻烦在于：两个表都不是"只看看、不插手"的旁观者。',
ideal: '把两只表换成理想表（R_A = 0、R_V → ∞），R = U / I 就精确了。真表做不到这一点 —— 后面所有的误差，根子都在这里。',
pair: '同一套器材，电流表可以放在电压表"里面"（内接），也可以放在"外面"（外接）。放的位置不同，被多读进去的那一段就不同。',
int: '内接法：电压表的两根线跨在"Rₓ + 电流表"上。它读到的不是 Rₓ 两端的电压，而是 Rₓ 两端电压加上电流表自己吃掉的那一份。',
int2: '电流表串在回路里，同一个 I 既流过它、也流过 Rₓ。它吃掉 I·R_A —— 这一份电压被电压表老实记进了读数里，而 Rₓ 根本没用到它。',
int3: '所以 R测 = U/I = Rₓ + R_A，永远偏大，多出来的正好是 R_A。Rₓ 越大，R_A 占的比例越小 —— 内接法适合大电阻。',
ext: '外接法：电压表只跨在 Rₓ 两端，电压读得准。但电流表装在电压表外面，它读到的电流多了一条岔路。',
ext2: '电压表不是断开，它自己要走 U/R_V 的电流。电流表读的是"流过 Rₓ 的 + 流过电压表的"，于是把 Rₓ 的电流读大了。',
ext3: '所以 R测 = U/I = Rₓ∥R_V，永远偏小。Rₓ 越小，R_V 显得越大，误差越小 —— 外接法适合小电阻。',
curve: '把两种接法的相对误差画在同一张图上：内接的误差 ∝ 1/Rₓ，外接的误差 ∝ Rₓ，两条线必然相交，交点就是临界电阻。',
choice: '交点 R₀ = √(R_A·R_V)。Rₓ 比它大就用内接，比它小就用外接。口诀：大内小外。',
touch: '不知道 Rₓ 多大？两种接法各试一次，看哪个表的示数变化更明显：电压表变化大说明电流表分压碍事（Rₓ 小），改外接；电流表变化大说明电压表分流碍事（Rₓ 大），改内接。',
near: '临界附近两种都差得不多，也都不算好：换更准的表（R_A 更小、R_V 更大）、换量程，或者改用半偏法、电桥。',
volt: '电压表并联在 Rₓ 上测电压。它一接上就分走电流，把被测那一段"拉低"一点 —— 读数总比不接表时小，R_V 越大越接近真值。',
amp: '电流表串联进回路测电流。它的内阻串进来了，回路电流比不接表时小 —— 读数总偏小，R_A 越小越接近真值。',
final: '一句话：误差不来自"读数读错了"，而来自"表自己也在电路里"。内接多读了 I·R_A 的电压，外接多读了 U/R_V 的电流。'
};
return T[key] || '';
}

function runSelfTest() {
var fails = [], n = 0;
function ok(cond, msg) { n++; if (!cond) { fails.push(msg); } }
function near(a, b, tol, msg) { ok(Math.abs(a - b) <= (tol || 1e-9), msg + '（' + a + ' vs ' + b + '）'); }

var keys = ['h1', 'h2', 'h3'], i, j, mk, m;
for (i = 0; i < keys.length; i++) {
mk = keys[i]; m = meters(mk);
near(m.RA, m.Rg * m.Ig / A_RANGE, 1e-15, mk + ' R_A = Rg·Ig/I量程');
near(m.RV, V_RANGE / m.Ig, 1e-9, mk + ' R_V = U量程/Ig');
ok(m.RA > 0 && m.RV > 0, mk + ' 内阻为正');

for (j = 0; j < 6; j++) {
var rx = [1, 5, 22, 100, 900, 5000][j], rs = [0, 20, 100][j % 3];
var a = intRead(rx, rs, mk);
near(a.R, rx + m.RA, 1e-9, mk + ' 内接 R测=' + rx + 'Ω');
near(a.U / a.I, a.R, 1e-12, mk + ' 内接 U/I 自洽');
near(a.Ux + a.Ua, a.U, 1e-12, mk + ' 内接 U测 = U_Rx + I·R_A');
near((a.R - rx) / rx, deltaInt(rx, mk), 1e-12, mk + ' 内接 δ 公式');
ok(a.Ux / a.U < 1, mk + ' 内接 多读一段为正');

var b = extRead(rx, rs, mk);
near(b.R, rp(rx, m), 1e-9, mk + ' 外接 R测=' + rx + 'Ω');
near(b.U / b.I, b.R, 1e-12, mk + ' 外接 U/I 自洽');
near(b.Irx + b.Iv, b.I, 1e-12, mk + ' 外接 I测 = I_Rx + I_V');
near((b.R - rx) / rx, deltaExt(rx, mk), 1e-12, mk + ' 外接 δ 公式');

ok(a.R > rx, mk + ' 内接恒偏大 @' + rx);
ok(b.R < rx, mk + ' 外接恒偏小 @' + rx);
}

var r0 = rCrit(mk), r0a = rCritApprox(mk);
near(deltaInt(r0, mk), -deltaExt(r0, mk), 1e-9, mk + ' R₀ 处两侧误差等大');
near(r0 * r0 - m.RA * r0 - m.RA * m.RV, 0, 1e-6, mk + ' R₀ 满足方程');
ok(Math.abs(r0 / r0a - 1) < 0.03, mk + ' R₀ ≈ √(R_A R_V)');
ok(pickByError(r0 * 3, mk) === 'int', mk + ' Rₓ 大 → 内接');
ok(pickByError(r0 / 3, mk) === 'ext', mk + ' Rₓ 小 → 外接');

var idBad = 0, misBad = 0, checked = 0;
for (j = 1; j <= 240; j++) {
var t = j / 240, rr = rxOf(t), rsx = 20;
var tt = touchTest(rr, rsx, mk);
var Rp = rp(rr, m);
if (Math.abs(tt.ratio - rsx / Rp) / (rsx / Rp) > 0.02) { idBad++; }

if (Math.abs(Math.log(rr / rCrit(mk))) >= 0.5) {
checked++;
var tt2 = touchTest(rr, rCrit(mk), mk);
if (tt2.pick !== pickByError(rr, mk)) { misBad++; }
}
}
ok(idBad === 0, mk + ' 试触法恒等式 ΔU/ΔI = Rs/(Rₓ∥R_V)（偏差 ' + idBad + ' 处）');

function touchView(ctx, R, st) {

box(ctx, x, yBox, colW, boxH, { stroke: rgb(color, 0.55), w: 1.4 });
txt(ctx, title, x + 10, yBox - 12, { size: 12, weight: 700, color: color });
var lh = boxH / (narrowT ? 3 : 4);

txt(ctx, P.fmtU(U), x + colW - 12, yBox + lh * 0.6, { size: narrowT ? 13 : 16, weight: 700, align: 'right', color: C.blue });

col(x1, '② 接成外接', tt.Uext, tt.Iext, C.blue, '电流表在电压表外面');

var by = yBox + boxH + (narrowT ? 30 : Math.max(48, (bot - (yBox + boxH)) * 0.30));

var barMax = narrowT ? Math.max(60, R.w - pad * 2 - 20) : Math.max(80, R.w - pad * 2 - 190);
function rateRow(y, lab, v, color) {
if (narrowT) {
txt(ctx, lab, R.x + pad, y - 12, { size: 10, color: rgb(color, 0.8) });
var wpx2 = Math.max(2, (barMax - 52) * (v / maxv));
box(ctx, R.x + pad, y + 4, barMax - 52, 12, { stroke: rgb(C.ink, 0.16), w: 1 });
box(ctx, R.x + pad, y + 4, wpx2, 12, { fill: rgb(color, 0.38), stroke: color, w: 1 });

}
txt(ctx, lab, R.x + pad, y, { size: 11.5, color: rgb(color, 0.8) });
var wpx = Math.max(2, barMax * (v / maxv));
box(ctx, R.x + pad + 160, y - 9, barMax, 18, { stroke: rgb(C.ink, 0.16), w: 1 });

}

var yy = R.y + H - 16;

function curve(ctx, R, st) {
var m = P.metersOf(st);
var singleNow = (st.view === 'volt' || st.view === 'amp');

var tight = H < 150;

if (!tight) {
txt(ctx, singleNow ? '参考：两种接法 δ 随 Rₓ（横轴对数）' : 'δ 随 Rₓ 变化（横轴对数）',
R.x + pad, R.y + pad + 6, { size: 12, weight: 600, color: C.grey });
}

var marks = [1, 10, 100, 1000, 5000], i, xx;
for (i = 0; i < marks.length; i++) {
xx = gx0 + (gx1 - gx0) * P.tOfRx(marks[i]);
line(ctx, xx, gy0, xx, gy1, { color: rgb(C.ink, 0.09), w: 1 });
txt(ctx, marks[i] >= 1000 ? (marks[i] / 1000) + 'k' : marks[i] + '', xx, gy1 + 12,
{ size: 9.5, align: 'center', color: rgb(C.ink, 0.42) });
}
var ys = [1e-4, 1e-2, 1];
for (i = 0; i < ys.length; i++) {
var yy = gy1 - (gy1 - gy0) * P.dPos(ys[i]);

gx0 - 6, yy, { size: 9.5, align: 'right', color: rgb(C.ink, 0.42) });

function drawCurve(fn, color) {
ctx.beginPath();
var j, t, r, py;
for (j = 0; j <= 160; j++) {
t = j / 160; r = P.rxOf(t);
py = gy1 - (gy1 - gy0) * P.dPos(Math.abs(fn(r, m)));
xx = gx0 + (gx1 - gx0) * t;
if (j === 0) { ctx.moveTo(xx, py); } else { ctx.lineTo(xx, py); }
}
ctx.lineWidth = 2.4; ctx.strokeStyle = color; ctx.stroke();
}
drawCurve(P.deltaInt, C.red);
drawCurve(P.deltaExtAbs, C.blue);

if (!st.ideal) {
var r0 = P.rCrit(m), d0 = P.deltaInt(r0, m);

var cy = gy1 - (gy1 - gy0) * P.dPos(d0);

line(ctx, cx, cy, cx, gy1, { color: rgb(C.yellow, 0.45), w: 1, dash: [4, 4] });
txt(ctx, 'R₀ = ' + P.fmtR(r0), cx, cy - 12, { size: 10.5, align: 'center', color: C.yellow });
}

if (st.ideal) {
txt(ctx, '理想表：δ ≡ 0（两条曲线压在底线）', gx0 + (gx1 - gx0) / 2, (gy0 + gy1) / 2,
{ size: tight ? 10 : 11, align: 'center', color: rgb(C.green, 0.9) });
return;
}
var cxp = gx0 + (gx1 - gx0) * P.tOfRx(st.rx);
line(ctx, cxp, gy0, cxp, gy1, { color: C.yellow, w: 1.6, alpha: 0.85, dash: [6, 5] });

txt(ctx, '内接（偏大）', gx0 + 6, gy0 + 10, { size: 10, color: rgb(C.red, 0.9) });
txt(ctx, '外接（偏小）', gx0 + 6, gy0 + 24, { size: 10, color: rgb(C.blue, 0.9) });
}

function draw(ctx, W, H, st) {
texts = [];
ctx.save();
ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
ctx.textBaseline = 'middle';

var L = layout(W, H);
ctx.save();
ctx.beginPath(); ctx.rect(L.hero.x, L.hero.y, L.hero.w, L.hero.h); ctx.clip();
if (st.view === 'touch') { touchView(ctx, L.hero, st); } else { hero(ctx, L.hero, st); }
ctx.restore();

ctx.save();
ctx.beginPath(); ctx.rect(L.scale.x, L.scale.y, L.scale.w, L.scale.h); ctx.clip();
scale(ctx, L.scale, st);
ctx.restore();

if (L.curve && L.curve.h > 60) {
ctx.save();
ctx.beginPath(); ctx.rect(L.curve.x, L.curve.y, L.curve.w, L.curve.h); ctx.clip();
curve(ctx, L.curve, st);
ctx.restore();
line(ctx, L.hero.w, 0, L.hero.w, H, { color: rgb(C.ink, 0.12), w: 1 });
line(ctx, L.curve.x, L.curve.y, W, L.curve.y, { color: rgb(C.ink, 0.12), w: 1 });
}

ctx.restore();
}

function auditTexts(W, H) {

bad.push('「' + t.s + '」@(' + t.x0.toFixed(0) + ',' + t.y.toFixed(0) + ')');
}
}
return bad;
}
function auditOverlap() {
var bad = [], i, j, a, b;
for (i = 0; i < texts.length; i++) {
for (j = i + 1; j < texts.length; j++) {

if (st.step === 0) { ek = 'ask'; }
if (st.step === 2) { ek = 'pair'; }
if (st.step === 3) { ek = 'int'; }
if (st.step === 4) { ek = 'int2'; }
if (st.step === 5) { ek = 'int3'; }
if (st.step === 6) { ek = 'ext'; }
if (st.step === 7) { ek = 'ext2'; }
if (st.step === 8) { ek = 'ext3'; }
if (st.step === 9) { ek = 'curve'; }
if (st.step === 10) { ek = 'choice'; }
if (st.step === 11) { ek = 'near'; }
if (st.step === 12 || st.step === 13) { ek = 'touch'; }
if (st.step === 16) { ek = 'final'; }
document.getElementById('rdGroup3').innerHTML = '<div class="note">' + P.explain(ek) + '</div>';
document.getElementById('rdFormula').textContent = st.formula;
document.getElementById('rdNote').innerHTML = st.note;
}

function headBtnsHTML() {
var s = '', i;
for (i = 0; i < P.HEADS.length; i++) {
s += '<button data-hk="' + P.HEADS[i].key + '">' + P.HEADS[i].lab + '</button>';
}
return s;
}
var BUILT = false;
function buildControls() {
if (!BUILT) {
document.getElementById('headBtns').innerHTML = headBtnsHTML();
document.getElementById('idealBtns').innerHTML =
'<button data-ideal="0">真表</button><button data-ideal="1">理想表</button>';
BUILT = true;
}
var a = st.allow || {};
var map = { wrap_rx: !!a.rx, wrap_rs: !!a.rs, wrap_head: !!a.hk, wrap_ideal: !!a.ideal };
for (var k in map) {
var el = document.getElementById(k);
if (el) { el.classList.toggle('hidden', !map[k]); }
}
document.getElementById('rgRx').value = P.tOfRx(st.rx);
document.getElementById('rgRs').value = st.rs;
setTxt('lbRx', P.fmtR(st.rx), '');
setTxt('lbRs', st.rs.toFixed(0) + ' Ω', '');

var bs = document.querySelectorAll('#headBtns button'), i;
for (i = 0; i < bs.length; i++) { bs[i].classList.toggle('on', bs[i].dataset.hk === st.hk && !st.ideal); }
bs = document.querySelectorAll('#idealBtns button');
for (i = 0; i < bs.length; i++) {
bs[i].classList.toggle('on', (bs[i].dataset.ideal === '1') === !!st.ideal);
}
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function buildToc() {
var nav = document.getElementById('toc'), html = '', lastAct = '', i, d;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
if (d.act !== lastAct) {
if (lastAct) { html += '<span class="sep"></span>'; }
html += '<span class="grouplab">' + esc(d.act.split(' · ')[0]) + '</span>';
lastAct = d.act;
}
html += '<a data-go="' + i + '" title="' + esc(d.title) + '">' + (i + 1) + '</a>';
}
nav.innerHTML = html;
nav.addEventListener('click', function (e) {
var a2 = e.target.closest ? e.target.closest('a[data-go]') : null;
if (a2) { goto(parseInt(a2.dataset.go, 10)); }
});
}
function markToc() {
var as = document.querySelectorAll('#toc a'), i;
for (i = 0; i < as.length; i++) {
as[i].classList.toggle('on', parseInt(as[i].dataset.go, 10) === st.step);
}
}

/* ===================== 绘制 ===================== */
var settlePending = false;
function scheduleSettle() {
if (settlePending || !window.requestAnimationFrame) { return; }
settlePending = true;
window.requestAnimationFrame(function () {
fitCanvas(); R.draw(ctx, W, H, st);
window.requestAnimationFrame(function () {
settlePending = false;
fitCanvas(); R.draw(ctx, W, H, st);
});
});
}
function draw() {
updatePanel();
markToc();
buildControls();
void document.body.offsetHeight;
fitCanvas();
R.draw(ctx, W, H, st);
document.getElementById('actTag').textContent = st.act;
document.getElementById('stepTitle').textContent = st.title;
document.getElementById('stepSn').textContent = (st.step + 1) + ' / ' + S.STEPS.length;
document.getElementById('hint').innerHTML = st.hint;
document.getElementById('prog').firstElementChild.style.width = ((st.step + 1) / S.STEPS.length * 100) + '%';
cv.style.cursor = (st.allow && st.allow.rx) ? 'grab' : 'default';
for (var gu = 0; gu < 3; gu++) { if (!fitCanvas()) { break; } R.draw(ctx, W, H, st); }
scheduleSettle();
}

/* ===================== 步骤机 ===================== */
function goto(i) { S.apply(st, i); draw(); }
function next() { if (st.step < S.STEPS.length - 1) { goto(st.step + 1); } }
function prev() { if (st.step > 0) { goto(st.step - 1); } }
function reset() { goto(st.step); }

function setRx(rx) { st.rx = P.clamp(rx, P.RX_MIN, P.RX_MAX); draw(); }
function setRs(rs) { st.rs = P.clamp(rs, P.RS_MIN, P.RS_MAX); draw(); }
function setHead(k) { st.hk = k; st.ideal = false; draw(); }
function setIdeal(v) { st.ideal = !!v; draw(); }

/* ===================== 交互 ===================== */
function canvasXY(e) {
var r = cv.getBoundingClientRect();
return { x: e.clientX - r.left, y: e.clientY - r.top };
}
/* 画布上 Rₓ 的滑轨：主电路区底部的一条横条 */
function dragMap() {
var L = R.layout(W, H), h = L.hero;
var x0 = h.x + 40, x1 = h.x + h.w - 40;
var y = h.y + h.h - 58;
return { x0: x0, x1: x1, y: y, key: 'rx' };
}

function bind() {
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnReset').onclick = reset;
document.getElementById('rgRx').addEventListener('input', function () {
setRx(P.rxOf(parseFloat(this.value)));
});
document.getElementById('rgRs').addEventListener('input', function () {
setRs(parseFloat(this.value));
});
document.getElementById('headBtns').addEventListener('click', function (e) {
var b = e.target.closest ? e.target.closest('button[data-hk]') : null;
if (b) { setHead(b.dataset.hk); }
});
document.getElementById('idealBtns').addEventListener('click', function (e) {
var b = e.target.closest ? e.target.closest('button[data-ideal]') : null;
if (b) { setIdeal(b.dataset.ideal === '1'); }
});

cv.addEventListener('pointerdown', function (e) {
if (!(st.allow && st.allow.rx)) { return; }
var p = canvasXY(e), m = dragMap();
if (p.y < m.y - 26 || p.y > m.y + 26) { return; }
drag = m;
try { cv.setPointerCapture(e.pointerId); } catch (err) { }
cv.style.cursor = 'grabbing';
setRx(P.rxOf((p.x - m.x0) / Math.max(1, m.x1 - m.x0)));
});
cv.addEventListener('pointermove', function (e) {
if (!drag) { return; }
var p = canvasXY(e);
setRx(P.rxOf((p.x - drag.x0) / Math.max(1, drag.x1 - drag.x0)));
});
function endDrag(e) {
drag = null;
cv.style.cursor = (st.allow && st.allow.rx) ? 'grab' : 'default';
try { cv.releasePointerCapture(e.pointerId); } catch (err) { }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', function () { drag = null; });

document.addEventListener('keydown', function (e) {
if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) { return; }
if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
else if (e.key === 'Home') { goto(0); }
else if (e.key === 'End') { goto(S.STEPS.length - 1); }
else if (e.key >= '1' && e.key <= '3' && st.allow && st.allow.hk) { setHead(P.HEADS[parseInt(e.key, 10) - 1].key); }
});

window.addEventListener('resize', function () { fitCanvas(); R.draw(ctx, W, H, st); });
}

/* ===================== 自检钩子 ===================== */
function hash() {
if (!W || !H) { return 'empty'; }
var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
var h = 2166136261 >>> 0, i, step = 97;
for (i = 0; i < d.length; i += step * 4) {
h ^= d[i]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 1]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 2]; h = Math.imul(h, 16777619) >>> 0;
}
return (h >>> 0).toString(16);
}

function checkAllowConsistency() {
var bad = [], i, d, t, a;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i]; t = d.hint || ''; a = d.allow || {};
if (/拖/.test(t) && !a.rx) { bad.push('step' + (i + 1) + ': hint 提到拖动，allow.rx 缺失'); }
if (/表头/.test(t) && !a.hk) { bad.push('step' + (i + 1) + ': hint 提到表头，allow.hk 缺失'); }
/* 只有"让你去切理想表"才算交互承诺；叙述里出现这个词不算 */
if (/(切到|换成|打开|关掉)理想表/.test(t) && !a.ideal) { bad.push('step' + (i + 1) + ': hint 要求切理想表，allow.ideal 缺失'); }
if (/串联/.test(t) && !a.rs) { bad.push('step' + (i + 1) + ': hint 提到串联，allow.rs 缺失'); }
if (!d.dragKey) { bad.push('step' + (i + 1) + ': dragKey 缺失'); }
}
return { ok: bad.length === 0, bad: bad };
}

function auditAll(view) {
var w = (view && view.w) || 1280, h = (view && view.h) || 720;
var W0 = W, H0 = H, cur = st.step, bad = [], i, k;
W = w; H = h;
for (i = 0; i < S.STEPS.length; i++) {
S.apply(st, i);
for (k = 0; k < 3; k++) { R.draw(ctx, w, h, st); }
var bb = R.auditTexts(w, h);
for (k = 0; k < bb.length; k++) { bad.push('step' + (i + 1) + ': ' + bb[k]); }
if (R.auditOverlap) {
var ov = R.auditOverlap(w, h);
for (k = 0; k < ov.length && k < 3; k++) { bad.push('重叠 step' + (i + 1) + ': ' + ov[k]); }
}
}
W = W0; H = H0;
goto(cur);
return { w: w, h: h, bad: bad };
}

window.__viz = {
selfTest: function () {
var p = P.runSelfTest(), c = checkAllowConsistency();
var fails = p.fails.slice();
if (!c.ok) { fails = fails.concat(c.bad); }
return { pass: p.nfail + (c.ok ? 0 : c.bad.length) === 0, cases: p.cases, nfail: p.nfail + (c.ok ? 0 : c.bad.length), fails: fails.slice(0, 12) };
},
hash: hash, goto: goto, next: next, prev: prev,
state: function () { return st; },
steps: S.STEPS.length,
checkAllow: checkAllowConsistency,
auditAll: auditAll,
setRx: setRx, setRs: setRs, setHead: setHead, setIdeal: setIdeal,
stepTitles: function () { return S.STEPS.map(function (d) { return d.act + ' | ' + d.title; }); },
diag: function () { return { W: W, H: H, cw: cv.width, ch: cv.height, view: st.view, step: st.step, hk: st.hk }; }
};

/* ===================== 启动 ===================== */
buildToc();
bind();
goto(0);
window.addEventListener('load', function () { fitCanvas(); R.draw(ctx, W, H, st); });
if (window.requestAnimationFrame) {
window.requestAnimationFrame(function () { fitCanvas(); R.draw(ctx, W, H, st); });
}
if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
document.fonts.ready.then(function () { fitCanvas(); R.draw(ctx, W, H, st); });
}
})();
</script>
</body>
</html>
